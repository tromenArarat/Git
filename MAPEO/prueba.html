<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Viviendas - Chos Malal, Neuquén</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        #map { width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 1000;
            text-align: center;
            pointer-events: none;
            max-width: 90%;
        }
        #info a { color: #4fc3f7; pointer-events: auto; }
        .stats {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            z-index: 1000;
            max-width: 320px;
            pointer-events: none;
        }
        .stats .title { color: #fff; font-weight: bold; margin-bottom: 5px; }
        .stats .value { color: #4fc3f7; }
        .stats .error { color: #ff6b6b; }
        .stats .success { color: #51cf66; }
        .custom-marker {
            background: #ff4444;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.8);
        }
        .wms-error {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
            display: none;
            max-width: 90%;
            text-align: center;
        }
        .leaflet-control-layers {
            max-height: 70vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div id="info">
        🏠 Chos Malal, Neuquén - Radio <b>15 km</b> | 
        <a href="#" onclick="testWMS()" style="pointer-events:auto; color:#4fc3f7;">Probar WMS</a> |
        <span id="requestCount" style="color:#ffd93d;">0</span> peticiones
    </div>

    <div class="stats" id="stats">
        <div class="title">📍 Chos Malal, Neuquén</div>
        <div>Centro: <span class="value" id="centerCoords">-37.3722, -70.2744</span></div>
        <div>Radio: <span class="value">15 km</span></div>
        <div>Peticiones WMS: <span class="value" id="wmsCount">0</span></div>
        <div>Estado: <span class="value" id="statusText">Cargando...</span></div>
    </div>

    <div class="wms-error" id="wmsError">⚠️ Error cargando WMS</div>

    <script>
        // === COORDENADAS DE CHOS MALAL, NEUQUÉN ===
        var latCentro = -37.372246;
        var lngCentro = -70.274423;
        var radioKm = 15;  // <--- AUMENTADO A 15 KM
        
        console.log('=== INICIALIZANDO MAPA ===');
        console.log('📍 Chos Malal, Neuquén');
        console.log(`Latitud: ${latCentro}, Longitud: ${lngCentro}`);
        console.log(`Radio: ${radioKm} km`);

        // === INICIALIZAR MAPA ===
        var mimapa = L.map('map', {
            center: [latCentro, lngCentro],
            zoom: 12,  // Zoom más alejado para ver el área de 15 km
            zoomControl: true
        });

        // === CAPAS BASE ===
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        });

        var satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri'
        });

        // === MARCADOR EN CHOS MALAL ===
        var marker = L.marker([latCentro, lngCentro], {
            icon: L.divIcon({ 
                className: 'custom-marker', 
                iconSize: [14, 14],
                popupAnchor: [0, -10]
            })
        }).addTo(mimapa);
        
        marker.bindPopup(`
            <b>🏘️ Chos Malal, Neuquén</b><br>
            Lat: ${latCentro.toFixed(6)}<br>
            Lng: ${lngCentro.toFixed(6)}<br>
            Radio: ${radioKm} km
        `).openPopup();

        // === CÍRCULO DE 15 KM ===
        var circle = L.circle([latCentro, lngCentro], {
            radius: radioKm * 1000,
            color: '#4fc3f7',
            weight: 2,
            opacity: 0.8,
            fillColor: '#4fc3f7',
            fillOpacity: 0.08,
            dashArray: '8, 4'
        }).addTo(mimapa);

        // === CALCULAR BBOX PARA 15 KM ===
        var kmPorGrado = 111.32;
        var delta = radioKm / kmPorGrado;  // ~0.1347 grados
        var bboxMinX = lngCentro - delta;
        var bboxMinY = latCentro - delta;
        var bboxMaxX = lngCentro + delta;
        var bboxMaxY = latCentro + delta;
        var bboxStr = `${bboxMinX},${bboxMinY},${bboxMaxX},${bboxMaxY}`;
        
        console.log(`BBOX (minx,miny,maxx,maxy): ${bboxStr}`);

        // Contador de peticiones
        var wmsRequestCount = 0;

        function contarPeticion() {
            wmsRequestCount++;
            document.getElementById('wmsCount').textContent = wmsRequestCount;
            document.getElementById('requestCount').textContent = wmsRequestCount;
        }

        // === CAPAS WMS CON RECORTE AL ÁREA DE INTERÉS ===
        // Todas las capas usan el mismo BBOX para limitar al área de 15 km
        
        var adus = L.tileLayer.wms("https://sig.viviendaneuquen.gov.ar/arcgis/services/INTEGRABILIDAD/VIVIENDAS_IPVU_ADUS_INT/MapServer/WmsServer", {
            layers: "0",
            styles: "default",
            format: 'image/png',
            transparent: true,
            version: '1.1.1',
            opacity: 0.8,
            bbox: bboxStr,  // RECORTAR AL ÁREA DE 15 KM
            attribution: "ADUS - Viviendas"
        });

        var ipvu = L.tileLayer.wms("https://sig.viviendaneuquen.gov.ar/arcgis/services/INTEGRABILIDAD/VIVIENDAS_IPVU_ADUS_INT/MapServer/WmsServer", {
            layers: "1",
            styles: "default",
            format: 'image/png',
            transparent: true,
            version: '1.1.1',
            opacity: 0.8,
            bbox: bboxStr,  // RECORTAR AL ÁREA DE 15 KM
            attribution: "IPVU - Viviendas"
        });

        // === CAPAS CON DIFERENTES ESTILOS (POR SI FALTAN) ===
        // Algunos servidores necesitan estilos específicos
        var adusStyle = L.tileLayer.wms("https://sig.viviendaneuquen.gov.ar/arcgis/services/INTEGRABILIDAD/VIVIENDAS_IPVU_ADUS_INT/MapServer/WmsServer", {
            layers: "0",
            styles: "",  // Estilo vacío
            format: 'image/png',
            transparent: true,
            version: '1.1.1',
            opacity: 0.8,
            bbox: bboxStr,
            attribution: "ADUS - Sin estilo"
        });

        var ipvuStyle = L.tileLayer.wms("https://sig.viviendaneuquen.gov.ar/arcgis/services/INTEGRABILIDAD/VIVIENDAS_IPVU_ADUS_INT/MapServer/WmsServer", {
            layers: "1",
            styles: "",
            format: 'image/png',
            transparent: true,
            version: '1.1.1',
            opacity: 0.8,
            bbox: bboxStr,
            attribution: "IPVU - Sin estilo"
        });

        // === CAPAS CON WMS 1.3.0 (POR SI FUNCIONA MEJOR) ===
        var bbox130 = `${bboxMinY},${bboxMinX},${bboxMaxY},${bboxMaxX}`;  // miny,minx,maxy,maxx
        var adus130 = L.tileLayer.wms("https://sig.viviendaneuquen.gov.ar/arcgis/services/INTEGRABILIDAD/VIVIENDAS_IPVU_ADUS_INT/MapServer/WmsServer", {
            layers: "0",
            styles: "default",
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            opacity: 0.8,
            crs: L.CRS.EPSG4326,
            bbox: bbox130,
            attribution: "ADUS - 1.3.0"
        });

        var ipvu130 = L.tileLayer.wms("https://sig.viviendaneuquen.gov.ar/arcgis/services/INTEGRABILIDAD/VIVIENDAS_IPVU_ADUS_INT/MapServer/WmsServer", {
            layers: "1",
            styles: "default",
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            opacity: 0.8,
            crs: L.CRS.EPSG4326,
            bbox: bbox130,
            attribution: "IPVU - 1.3.0"
        });

        // === EVENTOS DE CARGA ===
        function onWMSLoad() {
            document.getElementById('statusText').textContent = '✅ WMS cargado';
            document.getElementById('statusText').className = 'success';
            document.getElementById('wmsError').style.display = 'none';
        }

        function onWMSError(e) {
            document.getElementById('statusText').textContent = '❌ Error WMS';
            document.getElementById('statusText').className = 'error';
            document.getElementById('wmsError').style.display = 'block';
            document.getElementById('wmsError').textContent = `⚠️ Error: ${e.target._url || 'No se pudo cargar el WMS'}`;
            console.error('Error WMS:', e);
        }

        // Asignar eventos a todas las capas
        [adus, ipvu, adusStyle, ipvuStyle, adus130, ipvu130].forEach(function(layer) {
            layer.on('loading', function() {
                contarPeticion();
                document.getElementById('statusText').textContent = 'Cargando WMS...';
                document.getElementById('statusText').className = 'value';
            });
            layer.on('load', onWMSLoad);
            layer.on('error', onWMSError);
        });

        // === AGREGAR CAPAS ===
        osm.addTo(mimapa);

        // === CONTROLES ===
        var baseMaps = {
            '🗺️ OpenStreetMap': osm,
            '🛰️ Satelital (Esri)': satelite
        };

        var overlayMaps = {
            '🏠 Viviendas ADUS (1.1.1)': adus,
            '🏠 Viviendas IPVU (1.1.1)': ipvu,
            '🏠 Viviendas ADUS (sin estilo)': adusStyle,
            '🏠 Viviendas IPVU (sin estilo)': ipvuStyle,
            '🏠 Viviendas ADUS (1.3.0)': adus130,
            '🏠 Viviendas IPVU (1.3.0)': ipvu130,
            '📍 Centro (Chos Malal)': marker,
            '📏 Radio 15 km': circle
        };

        L.control.layers(baseMaps, overlayMaps, {
            position: 'topleft',
            collapsed: false
        }).addTo(mimapa);

        L.control.scale({
            metric: true,
            imperial: false,
            position: 'bottomleft'
        }).addTo(mimapa);

        // === FUNCIÓN PARA PROBAR WMS ===
        window.testWMS = function() {
            var testUrl = 'https://sig.viviendaneuquen.gov.ar/arcgis/services/INTEGRABILIDAD/VIVIENDAS_IPVU_ADUS_INT/MapServer/WmsServer?' +
                'SERVICE=WMS&' +
                'VERSION=1.1.1&' +
                'REQUEST=GetMap&' +
                'LAYERS=0&' +
                'STYLES=default&' +
                'SRS=EPSG:4326&' +
                `BBOX=${bboxStr}&` +
                'WIDTH=800&' +
                'HEIGHT=600&' +
                'FORMAT=image/png&' +
                'TRANSPARENT=TRUE';
            
            console.log('🔍 URL de prueba (1.1.1):', testUrl);
            console.log('BBOX:', bboxStr);
            window.open(testUrl, '_blank');
        };

        // === FUNCIÓN PARA PROBAR CON ESTILO VACÍO ===
        window.testWMSEmpty = function() {
            var testUrl = 'https://sig.viviendaneuquen.gov.ar/arcgis/services/INTEGRABILIDAD/VIVIENDAS_IPVU_ADUS_INT/MapServer/WmsServer?' +
                'SERVICE=WMS&' +
                'VERSION=1.1.1&' +
                'REQUEST=GetMap&' +
                'LAYERS=0&' +
                'STYLES=&' +  // Estilo vacío
                'SRS=EPSG:4326&' +
                `BBOX=${bboxStr}&` +
                'WIDTH=800&' +
                'HEIGHT=600&' +
                'FORMAT=image/png&' +
                'TRANSPARENT=TRUE';
            
            console.log('🔍 URL de prueba (sin estilo):', testUrl);
            window.open(testUrl, '_blank');
        };

        // === MOSTRAR AYUDA ===
        console.log('✅ Mapa cargado correctamente en Chos Malal');
        console.log(`📏 Radio: ${radioKm} km`);
        console.log('💡 Activa las capas WMS desde el control superior izquierdo');
        console.log('💡 Prueba con testWMS() o testWMSEmpty() en la consola');
        console.log('💡 Si no ves datos, prueba con las diferentes versiones de WMS');
    </script>
</body>
</html>
